dataDirectory: data
mediaCatalogFile: data/media-catalog.json
videoDirectories: [media/videos]
ignoredVideoDirectories: []
audioDirectories: [media/audio]
flacCacheFile: flac-cache.json
playlistTemplate: "{playlistPath}"
videoPlaylistCommand: ["mpv.exe", "--no-terminal", "--fullscreen", "--playlist={playlistPath}"]
videoPlaylistSuffix: "_videos.m3u"
videoSingleFileCommand: ["mpv.exe", "--no-terminal", "--fullscreen"]
localTrackingStartCommand: ["foobar2000.exe", "{audioPath}"]
localTrackingStopCommand: ["foobar2000.exe", "/stop"]
spotifyClientId: ""
spotifyDeviceName: ""
spotifyRedirectUri: ""
playlistTxtFilePath: imports/queue.txt
playbackHistoryEnabled: true
playbackHistoryMinimumWatchedPercent: 50

# Optional category presets. The list order assigns keys 0 through 4 in the
